name: Collect Myfxbook outlook

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # lets you trigger a run manually to test

permissions:
  contents: write             # needed to commit the CSV back to the repo

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Take one reading
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
        run: python collector.py --once --symbols EURUSD --out data/outlook_log.csv

      - name: Commit data
        run: |
          git config user.name  "outlook-bot"
          git config user.email "outlook-bot@users.noreply.github.com"
          git add data/outlook_log.csv
          git diff --staged --quiet || (git commit -m "reading $(date -u +%FT%TZ)" && git pull --rebase && git push)
